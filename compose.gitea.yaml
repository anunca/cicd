services:
  gitea-db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GITEA_DB_NAME}
      POSTGRES_USER: ${GITEA_DB_USER}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD}
    volumes:
      - gitea-db-data:/var/lib/postgresql
    networks:
      - gitea
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER} -d ${SONAR_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

  gitea:
    image: gitea/gitea:${GITEA_VERSION}
    restart: unless-stopped
    init: true
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__server__DOMAIN: ${GITEA_HOST}
      GITEA__server__ROOT_URL: https://${GITEA_HOST}/
      GITEA__server__SSH_DOMAIN: ${GITEA_HOST}
      GITEA__server__SSH_PORT: "22"
      GITEA__server__LFS_START_SERVER: "false"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${GITEA_DB_NAME}
      GITEA__database__USER: ${GITEA_DB_USER}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - cicd
      - gitea
    depends_on:
      gitea-db:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.gitea.rule: Host(`${GITEA_HOST}`)
      traefik.http.routers.gitea.entrypoints: websecure
      traefik.http.routers.gitea.tls: "true"
      traefik.http.services.gitea.loadbalancer.server.port: "3000"
      traefik.tcp.routers.gitea-ssh.rule: HostSNI(`*`)
      traefik.tcp.routers.gitea-ssh.entrypoints: ssh
      traefik.tcp.routers.gitea-ssh.service: gitea-ssh
      traefik.tcp.services.gitea-ssh.loadbalancer.server.port: "22"
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  gitea-db-data:
  gitea-data:

networks:
  cicd:
    external: true
    name: ${CICD_NETWORK}
  gitea:
    internal: true
