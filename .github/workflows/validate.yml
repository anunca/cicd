name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Check whitespace
        run: git diff --check
      - name: Validate Compose configuration
        run: make config
      - name: Check shell scripts
        run: shellcheck sh/*.sh

  dockerfile-lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' dockerfiles < <(find . -type f \( -name 'Dockerfile' -o -name 'Dockerfile.*' \) -print0)
          printf 'Linting %d Dockerfiles\n' "${#dockerfiles[@]}"
          (("${#dockerfiles[@]}" > 0)) || { echo "No Dockerfiles found"; exit 1; }
          docker run --rm -v "$PWD:/workspace" -w /workspace hadolint/hadolint:v2.15.1-alpine hadolint --config .hadolint.yaml "${dockerfiles[@]}"

  build:
    needs: [config, dockerfile-lint]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: make build
