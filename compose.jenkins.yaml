services:
  jenkins-docker:
    image: ${DOCKER_DIND_IMAGE}
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - jenkins-docker-data:/var/lib/docker
      - jenkins-docker-certs-ca:/certs/ca
      - jenkins-docker-certs-client:/certs/client
    networks:
      - cicd
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      options:
        max-size: 10m
        max-file: "3"

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
      args:
        DOCKER_CLI_IMAGE: ${DOCKER_CLI_IMAGE}
        JENKINS_IMAGE: ${JENKINS_IMAGE}
        KUBECTL_VERSION: ${KUBECTL_VERSION}
    image: ${APP_IMAGE}
    restart: unless-stopped
    init: true
    environment:
      CASC_JENKINS_CONFIG: /usr/local/jenkins/jenkins.yaml
      CASC_STRICT_SECRET_RESOLUTION: "true"
      DOCKER_HOST: tcp://jenkins-docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID}
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins-data:/var/jenkins_home
      - jenkins-docker-certs-client:/certs/client:ro
    secrets:
      - jenkins_admin_password
    networks:
      - cicd
    depends_on:
      jenkins-docker:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.jenkins.rule: Host(`${JENKINS_HOST}`)
      traefik.http.routers.jenkins.entrypoints: websecure
      traefik.http.routers.jenkins.tls: "true"
      traefik.http.services.jenkins.loadbalancer.server.port: "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/login >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  jenkins-data:
  jenkins-docker-data:
  jenkins-docker-certs-ca:
  jenkins-docker-certs-client:

networks:
  cicd:
    external: true
    name: ${CICD_NETWORK}

secrets:
  jenkins_admin_password:
    file: ./secrets/jenkins/admin_password
