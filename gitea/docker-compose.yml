services:
  gitea:
    image: $GITEA_IMAGE
    restart: always
    ports:
      - 3000
      - 22
    environment:
      USER_UID: 1000
      USER_GID: 1000
      DISABLE_REGISTRATION: 'true'
      HTTP_PORT: 3000
      SSH_PORT: 22
      LFS_START_SERVER: 'false'
    volumes:
      - data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    hostname: gitea.$DOMAIN_NAME
    networks:
      - cicd
    labels:
      traefik.enable: true
      traefik.http.routers.gitea.entrypoints: web
      traefik.http.routers.gitea.rule: Host(`$REGISTRY`)
      traefik.http.routers.gitea.service: gitea
      traefik.http.services.gitea.loadbalancer.server.port: 3000
      traefik.http.routers.gitea-ssl.entrypoints: websecure
      traefik.http.routers.gitea-ssl.rule: Host(`$REGISTRY`)
      traefik.http.routers.gitea-ssl.service: gitea
      traefik.http.services.gitea-ssl.loadbalancer.server.port: 3000
      traefik.http.routers.gitea-ssl.tls: true
      traefik.tcp.routers.gitea-ssh.entrypoints: ssh
      traefik.tcp.routers.gitea-ssh.rule: HostSNI(`*`)
      traefik.tcp.routers.gitea-ssh.service: gitea-ssh-svc
      traefik.tcp.services.gitea-ssh-svc.loadbalancer.server.port: 22
volumes:
  data:
networks:
  cicd:
    external: true # name: cicd
