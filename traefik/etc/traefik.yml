# Docker configuration backend
providers:
  docker:
    exposedbydefault: false

  file:
    filename: /etc/traefik/config.yml
    watch: true

entrypoints:
  web:
    address: ':80'
    # http:
    #   redirections:
    #     entryPoint:
    #       to: websecure
    #       scheme: https
  websecure:
    address: ':443'
  ssh:
    address: ':22'

log:
  level: DEBUG

# API and dashboard configuration
api:
  insecure: true
